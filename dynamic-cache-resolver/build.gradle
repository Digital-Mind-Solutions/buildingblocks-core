plugins {
    id 'java-library'
    id 'maven-publish'
}
group 'org.digitalmind.buildingblocks.core'

ext {
    lombokVersion = '1.18.44'
    springfoxVersion = '2.9.2'
    swaggerVersion = '1.6.0'
    swaggerCodegenVersion = '2.4.0'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
jar {
    archiveBaseName = "dynamic-cache-resolver"
    enabled = true
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-web"

    implementation "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

publishing {
    repositories {
        maven {
            name = "digitalmind"
            url = uri("https://maven.pkg.github.com/Digital-Mind-Solutions/maven-repository")
            credentials {
                username = project.findProperty("dm.ghub.user") ?: System.getenv("DM_GITHUB_USER")
                password = project.findProperty("dm.ghub.key") ?: System.getenv("DM_GITHUB_TOKEN")
            }
        }
    }
    publications {
        dynamicCacheResolver(MavenPublication) {
            from components.java
        }
    }
}
