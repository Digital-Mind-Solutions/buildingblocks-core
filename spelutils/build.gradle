plugins {
    id 'java-library'
    id 'maven-publish'
}
group 'org.digitalmind.buildingblocks.core'

ext {
    lombokVersion = '1.18.44'
    springfoxVersion = '2.9.2'
    swaggerVersion = '1.6.0'
    swaggerCodegenVersion = '2.4.0'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
jar {
    archiveBaseName = "spelutils"
    enabled = true
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"

    implementation "com.google.guava:guava:28.2-jre"

    implementation "commons-validator:commons-validator:1.6"
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.11.4'
    implementation 'com.googlecode.libphonenumber:carrier:1.124'

    implementation "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

publishing {
    repositories {
        maven {
            name = "digitalmind"
            url = uri("https://maven.pkg.github.com/Digital-Mind-Solutions/maven-repository")
            credentials {
                username = project.findProperty("dm.ghub.user") ?: System.getenv("DM_GITHUB_USER")
                password = project.findProperty("dm.ghub.key") ?: System.getenv("DM_GITHUB_TOKEN")
            }
        }
    }
    publications {
        spelUtils(MavenPublication) {
            from components.java
        }
    }
}
