plugins {
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'org.digitalmind.buildingblocks.core'
    version = '4.0.0'

    repositories {
        mavenLocal()
        mavenCentral()

        def nexusMavenPublicUrl = findProperty('nexusMavenPublicUrl') ?: System.getenv('NEXUS_MAVEN_PUBLIC_URL')
        if (nexusMavenPublicUrl) {
            maven {
                name = 'nexus-maven-public'
                url = uri(nexusMavenPublicUrl)
                allowInsecureProtocol = nexusMavenPublicUrl.toString().startsWith('http:')
            }
        }

        def nexusDigitalUrl = findProperty('nexusDigitalUrl') ?: System.getenv('NEXUS_DIGITAL_URL')
        if (nexusDigitalUrl) {
            maven {
                name = 'nexus-vdf-digital'
                url = uri(nexusDigitalUrl)
                allowInsecureProtocol = nexusDigitalUrl.toString().startsWith('http:')
                def nexusUser = findProperty('nexusDigitalUser') ?: System.getenv('NEXUS_DIGITAL_USER')
                def nexusPass = findProperty('nexusDigitalPassword') ?: System.getenv('NEXUS_DIGITAL_PASSWORD')
                if (nexusUser && nexusPass) {
                    credentials {
                        username = nexusUser
                        password = nexusPass
                    }
                }
            }
        }

    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.3"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }
}
